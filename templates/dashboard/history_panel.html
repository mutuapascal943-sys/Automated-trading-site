<div class="section-title">Signal <span>History</span></div>
<div class="history-controls">
  <input class="search-input" type="text" placeholder="Search by market, date..." oninput="filterTable(this.value)">
  <button class="filter-chip active" onclick="chipFilter(this,'All')">All</button>
  <button class="filter-chip" onclick="chipFilter(this,'Correct')">Correct</button>
  <button class="filter-chip" onclick="chipFilter(this,'Missed')">Missed</button>
  <button class="filter-chip" onclick="chipFilter(this,'Pending')">Pending</button>
</div>
<div class="table-wrap">
  <table id="historyTable">
    <thead><tr><th>Date</th><th>Market</th><th>Signal</th><th>Entry</th><th>Exit</th><th>Result</th><th>Status</th></tr></thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>
