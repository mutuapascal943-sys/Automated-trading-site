<div class="section-title">Trade <span>History</span></div>
<div class="history-controls">
  <input class="search-input" type="text" placeholder="Search by market, date..." oninput="filterTable(this.value)">
  <button class="filter-chip active" onclick="chipFilter(this,'All')">All</button>
  <button class="filter-chip" onclick="chipFilter(this,'Win')">Wins</button>
  <button class="filter-chip" onclick="chipFilter(this,'Loss')">Losses</button>
  <button class="filter-chip" onclick="chipFilter(this,'Pending')">Pending</button>
</div>
<div class="table-wrap">
  <table id="historyTable">
    <thead><tr><th>Date</th><th>Market</th><th>Type</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Status</th><th>Broker</th></tr></thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>
