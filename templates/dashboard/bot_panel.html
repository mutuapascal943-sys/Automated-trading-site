<div class="bot-filters">
  <div class="filter-group">
    <div class="filter-label">Market</div>
    <select class="filter-select" id="bot-market" onchange="updateBotMarket()">
      <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
      <option>AUD/USD</option><option>USD/CAD</option><option>NZD/USD</option>
      <option>XAU/USD</option><option>BTC/USD</option>
      <option>Boom 1000 Index</option><option>Crash 1000 Index</option>
      <option>Volatility 75 Index</option><option>Volatility 100 Index</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label" for="bot-timeframe">Timeframe</label>
    <select class="filter-select" id="bot-timeframe" onchange="updateBotTimeframe()">
      <option value="60">1 minute</option>
      <option value="120">2 minutes</option>
      <option value="180">3 minutes</option>
      <option value="300" selected>5 minutes</option>
      <option value="600">10 minutes</option>
      <option value="900">15 minutes</option>
      <option value="1800">30 minutes</option>
      <option value="3600">1 hour</option>
      <option value="7200">2 hours</option>
      <option value="14400">4 hours</option>
      <option value="28800">8 hours</option>
      <option value="86400">1 day</option>
    </select>
  </div>
  <div class="filter-group">
    <div class="filter-label">Mode</div>
    <div class="filter-select" aria-label="System mode">Analysis only</div>
  </div>
</div>

<div class="bot-layout">
  <div class="chart-panel">
    <div class="chart-header">
      <div>
        <div class="chart-pair" id="bot-pair-label">EUR/USD</div>
        <div style="font-size:12px;color:var(--text3)" class="mono" id="bot-mode-label">SIGNALS ONLY</div>
      </div>
      <div class="chart-price" id="bot-price">Live market data unavailable</div>
    </div>
    <div class="chart-canvas-wrap">
      <div id="botChart" style="width:100%;height:360px"></div>
      <div id="chart-data-status" role="status" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;pointer-events:none">Live market data unavailable</div>
    </div>
    <div class="chart-levels-legend" id="chart-levels-legend" style="display:none">
      <span class="legend-item"><span class="legend-dot" style="background:#00d4aa"></span> Entry</span>
      <span class="legend-item"><span class="legend-dot" style="background:#ff4d6d"></span> Stop Loss</span>
      <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Take Profit</span>
    </div>
  </div>

  <div class="bot-sidebar">
    <div class="analysis-card">
      <div class="analysis-title"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle">bolt</span> Bot Status</div>
      <div class="bot-status-row">
        <span class="status-dot" id="bot-status-dot"></span>
        <span id="bot-status-text">Idle</span>
      </div>
      <div class="scan-status" id="scanStatus"></div>
      <button class="btn-full" id="bot-toggle-btn" onclick="toggleBot()">
        <span class="material-symbols-outlined" style="font-size:16px">play_arrow</span> START BOT
      </button>
    </div>

    <div class="analysis-card" id="bot-signal-card">
      <div class="analysis-title"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle">bolt</span> Latest Signal</div>
      <div id="bot-latest-signal" style="font-size:12px;color:var(--text2)">
        <span>No signal yet. Start the bot to scan.</span>
      </div>
    </div>
  </div>
</div>

<script>
var botScanInterval = false;
var botScanTimer = null;
var botWaitExpiresAt = null;
var lastSignalKey = null;
var lastPendingSignalId = null;

function toggleBot(){
  var btn = document.getElementById('bot-toggle-btn');
  if(!btn) return;
  var isRunning = btn.classList.contains('running');
  if(isRunning){
    stopBot();
  } else {
    startBot();
  }
}

function runSignalScan(){
  var pair = document.getElementById('bot-market') ? document.getElementById('bot-market').value : 'EUR/USD';
  var timeframe = Number(document.getElementById('bot-timeframe')?.value || 300);
  var ss = document.getElementById('scanStatus');
  var searchStarted = Date.now();
  var searchTimer = null;
  window.lastProposedSignal = null;
  if(typeof clearChartOverlay === 'function') clearChartOverlay();
  var signalEmpty = document.getElementById('signal-body-empty');
  var signalContent = document.getElementById('signal-body-content');
  var signalState = document.getElementById('signal-state-badge');
  if(signalEmpty) signalEmpty.style.display = 'block';
  if(signalContent) signalContent.style.display = 'none';
  if(signalState){ signalState.textContent = 'SEARCHING'; signalState.className = 'signal-state-badge'; }
  if(ss) ss.textContent = '> Searching ' + pair + ' for live 4-of-5 analysis...\n';
  if(typeof AbortController !== 'undefined'){
    window.currentAnalysisController = new AbortController();
    searchTimer = setTimeout(function(){ window.currentAnalysisController.abort(); }, 185000);
  }

  fetch('/api/analyze-signal/', {
    method: 'POST',
    signal: window.currentAnalysisController ? window.currentAnalysisController.signal : undefined,
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
    body: JSON.stringify({query_type: 'market_analysis', prompt: pair, granularity: timeframe}),
  })
  .then(function(response){
    return response.json().then(function(data){
      if(!response.ok) throw new Error(data.error || 'Market analysis could not start');
      return data;
    });
  })
  .then(function(data){
    var timings = (data.analysis && data.analysis.timings) || {};
    var elapsed = timings.total_ms || data.analysis_duration_ms || (Date.now() - searchStarted);
    if(ss){
      ss.textContent += '> Analysis completed in ' + elapsed.toFixed(0) + ' ms.\n';
      ss.textContent += '> Deriv ' + (timings.live_candle_retrieval_ms || timings.deriv_timeframes_ms || 0).toFixed(0) +
        ' ms | Strategies ' + (timings.strategy_ms || 0).toFixed(0) +
        ' ms | ML ' + (timings.ml_ms || 0).toFixed(0) +
        ' ms | Consensus ' + (timings.consensus_ms || 0).toFixed(0) +
        ' ms | Database ' + (timings.database_ms || 0).toFixed(0) + ' ms.\n';
    }
    if(data.decision === 'WAIT' && data.wait_expires_at){
      botWaitExpiresAt = new Date(data.wait_expires_at).getTime();
    }
    if(ss && data.trial && data.trial.status === 'trial'){
      ss.textContent += '> Trial signals remaining: ' + data.trial.signals_remaining + '/10.\n';
    }
    if(ss && data.analysis){
      var consensus = data.analysis.consensus || {};
      ss.textContent += '> Strategy agreement: ' + (consensus.directional_votes || 0) + '/5 groups (' +
        (consensus.buy_votes || 0) + ' BUY, ' + (consensus.sell_votes || 0) + ' SELL, ' +
        (consensus.neutral_or_insufficient_votes || 0) + ' neutral/insufficient).\n';
    }
    if(data.decision === 'WAIT' || !data.signal || data.signal.signal_type === 'HOLD'){
      window.lastProposedSignal = null;
      if(typeof clearChartOverlay === 'function') clearChartOverlay();
      if(signalContent) signalContent.style.display = 'none';
      if(signalEmpty) signalEmpty.style.display = 'block';
      if(signalState){ signalState.textContent = 'WAIT'; signalState.className = 'signal-state-badge'; }
      if(ss) ss.textContent += '> WAIT: ' + (data.reason || data.message || 'No actionable signal.') + '\n';
      displayWaitResult(data.analysis, data.reason || data.message || 'No actionable signal.', elapsed);
      if(ss && data.wait_seconds_remaining != null){
        ss.textContent += '> Re-evaluating market in ' + data.wait_seconds_remaining + ' seconds.\n';
      }
      return;
    }
    if(data.pending){
      var s = data.signal;
      if(!s){
        if(ss) ss.textContent += '> Prediction pending — signal unchanged.\n';
        return;
      }
      if(s.entry_price && s.stop_loss && s.take_profit){
        displaySignal({
          current_price: s.entry_price,
          stop_loss: s.stop_loss,
          take_profit: s.take_profit,
        }, s, data.analysis, elapsed);
        if(ss) ss.textContent += '> Prediction: ' + s.signal_type + ' (confidence: ' + s.confidence + '%) — pending, signal unchanged.\n';
        return;
      }
      if(ss) ss.textContent += '> Approved signal is missing verified entry/stop/target evidence; displaying WAIT.\n';
      return;
    }
    var s = data.signal;
    lastPendingSignalId = s.id;
    if(s.entry_price && s.stop_loss && s.take_profit){
      displaySignal({
        current_price: s.entry_price,
        stop_loss: s.stop_loss,
        take_profit: s.take_profit,
      }, s, data.analysis, elapsed);
      if(ss) ss.textContent += '> Signal generated: ' + s.signal_type + ' (confidence: ' + s.confidence + '%)\n';
      if(ss) ss.textContent += '> Entry: ' + s.entry_price + ' | SL: ' + s.stop_loss + ' | TP: ' + s.take_profit + '\n';
      return;
    }
    if(ss) ss.textContent += '> Approved signal is missing verified entry/stop/target evidence; displaying WAIT.\n';
  })
  .catch(function(err){
    window.lastProposedSignal = null;
    if(typeof clearChartOverlay === 'function') clearChartOverlay();
    if(signalContent) signalContent.style.display = 'none';
    if(signalEmpty) signalEmpty.style.display = 'block';
    if(signalState){ signalState.textContent = 'WAIT'; signalState.className = 'signal-state-badge'; }
    var ss = document.getElementById('scanStatus');
    if(ss) ss.textContent += '> WAIT: ' + (err.name === 'AbortError' ? 'Server analysis request exceeded client wait limit.' : err.message) + '\n';
    displayWaitResult(null, err.name === 'AbortError' ? 'Analysis request timed out' : err.message, Date.now() - searchStarted);
    if(typeof showToast === 'function') showToast(err.message, 'error');
  })
  .then(function(){
    if(searchTimer) clearTimeout(searchTimer);
    window.currentAnalysisController = null;
    if(botScanInterval){
      fetch('/api/bot/control/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
        body: JSON.stringify({action: 'results'}),
      }).finally(function(){
        var statusText = document.getElementById('bot-status-text');
        if(statusText && botScanInterval) statusText.textContent = 'Results';
        var nextScanDelay = botWaitExpiresAt ? Math.max(0, botWaitExpiresAt - Date.now()) : 30000;
        botScanTimer = setTimeout(function(){
          fetch('/api/bot/control/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
            body: JSON.stringify({action: 'running'}),
          }).finally(function(){
            botWaitExpiresAt = null;
            if(botScanInterval){
              var nextStatus = document.getElementById('bot-status-text');
              if(nextStatus) nextStatus.textContent = 'Scanning...';
              runSignalScan();
            }
          });
        }, nextScanDelay);
      });
    }
  });
}

function strategyEvidenceMarkup(analysis){
  var consensus = analysis && analysis.consensus ? analysis.consensus : {};
  var votes = (consensus.directional_votes || 0) + '/5 groups (' +
    (consensus.buy_votes || 0) + ' BUY, ' + (consensus.sell_votes || 0) + ' SELL, ' +
    (consensus.neutral_or_insufficient_votes || 0) + ' neutral/insufficient)';
  var strategies = analysis && Array.isArray(analysis.strategies) ? analysis.strategies : [];
  var rows = strategies.map(function(item){
    var confidence = Number(item.confidence);
    var confidenceText = Number.isFinite(confidence) ? ' ' + Math.round(confidence * 100) + '%' : '';
    var detail = (item.reasons || []).slice(0, 2).join('; ') || item.error || (item.conditions || []).slice(0, 2).join('; ');
    return '<div><strong>' + escapeHtml(String(item.name || 'Strategy')) + ':</strong> ' +
      escapeHtml(String(item.bias || 'neutral').toUpperCase() + confidenceText) +
      (detail ? '<div style="color:var(--text3)">' + escapeHtml(detail) + '</div>' : '') + '</div>';
  }).join('');
  return '<div style="display:grid;gap:5px;margin-top:8px"><div><strong>Agreement:</strong> ' +
    escapeHtml(votes) + '</div>' + (rows || '<div>Strategy evidence unavailable</div>') + '</div>';
}

function displayWaitResult(analysis, reason, elapsed){
  var sigEl = document.getElementById('bot-latest-signal');
  if(!sigEl) return;
  var pair = document.getElementById('bot-market') ? document.getElementById('bot-market').value : 'EUR/USD';
  sigEl.innerHTML = '<div style="margin-bottom:8px"><strong>WAIT</strong> <span style="color:var(--accent)">' +
    escapeHtml(pair) + '</span></div><div>' + escapeHtml(reason) + '</div>' +
    '<div style="margin-top:6px"><strong>Analysis duration:</strong> ' + escapeHtml(String(elapsed)) + ' ms</div>' +
    strategyEvidenceMarkup(analysis);
}

function displaySignal(proposal, signalData, analysis, elapsed){
  var sigEl = document.getElementById('bot-latest-signal');
  if(!sigEl) return;
  var pair = document.getElementById('bot-market') ? document.getElementById('bot-market').value : 'EUR/USD';
  var signalType = signalData ? signalData.signal_type : 'SIGNAL';
  var confidence = signalData ? signalData.confidence : 0;
  var sigKey = pair + '|' + signalType + '|' + proposal.current_price + '|' + proposal.stop_loss + '|' + proposal.take_profit + '|' + confidence;
  if(sigKey === lastSignalKey) return;
  lastSignalKey = sigKey;
  var timeStr = new Date().toLocaleTimeString();
  var safePair = escapeHtml(pair);
  var safeType = escapeHtml(signalType);
  sigEl.innerHTML =
    '<div style="margin-bottom:8px"><strong>' + safeType + '</strong> <span style="color:var(--accent)">' + safePair + '</span></div>' +
    '<div style="display:grid;gap:4px;font-size:11px">' +
    '<div><span style="color:var(--text3)">Entry:</span> ' + escapeHtml(String(proposal.current_price)) + '</div>' +
    '<div><span style="color:var(--text3)">SL:</span> ' + escapeHtml(String(proposal.stop_loss)) + '</div>' +
    '<div><span style="color:var(--text3)">TP:</span> ' + escapeHtml(String(proposal.take_profit)) + '</div>' +
    '<div><span style="color:var(--text3)">Confidence:</span> ' + confidence + '%</div>' +
    '<div><span style="color:var(--text3)">Generated:</span> ' + timeStr + '</div>' +
    '<div><span style="color:var(--text3)">Analysis duration:</span> ' + escapeHtml(String(elapsed)) + ' ms</div>' +
    '</div>' + strategyEvidenceMarkup(analysis);

  if(typeof updateChartOverlay === 'function'){
    updateChartOverlay(proposal);
  }
}

function startBot(){
  if(botScanInterval) return;
  var pair = document.getElementById('bot-market') ? document.getElementById('bot-market').value : 'EUR/USD';
  var btn = document.getElementById('bot-toggle-btn');
  if(btn) btn.disabled = true;
  fetch('/api/bot/control/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
    body: JSON.stringify({action: 'start', market: pair}),
  }).then(function(response){
    if(!response.ok) return response.json().then(function(data){ throw new Error(data.error || 'Bot could not start'); });
    return response.json();
  }).then(function(){
    botScanInterval = true;
    startBotAfterAuthorization();
  }).catch(function(error){
    showToast(error.message, 'error');
  }).finally(function(){
    if(btn) btn.disabled = false;
  });
}

function startBotAfterAuthorization(){
  var btn = document.getElementById('bot-toggle-btn');
  var dot = document.getElementById('bot-status-dot');
  var txt = document.getElementById('bot-status-text');
  if(btn){ btn.classList.add('running'); btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">stop</span> STOP BOT'; }
  if(dot){ dot.className = 'status-dot running'; }
  if(txt){ txt.textContent = 'Scanning...'; }
  var ss = document.getElementById('scanStatus');
  if(ss){ ss.style.display = 'block'; ss.textContent = '> Bot started scanning...\n'; }

  runSignalScan();
}

function stopBot(){
  if(botScanTimer){
    clearTimeout(botScanTimer);
    botScanTimer = null;
  }
  botScanInterval = false;
  fetch('/api/bot/control/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
    body: JSON.stringify({action: 'stop'}),
  }).catch(function(){});
  var btn = document.getElementById('bot-toggle-btn');
  var dot = document.getElementById('bot-status-dot');
  var txt = document.getElementById('bot-status-text');
  if(btn){ btn.classList.remove('running'); btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">play_arrow</span> START BOT'; }
  if(dot){ dot.className = 'status-dot'; }
  if(txt){ txt.textContent = 'Idle'; }
  var ss = document.getElementById('scanStatus');
  if(ss){ ss.textContent += '> Bot stopped.\n'; }
}

/* Bot init hooks now handled in app.js navigateToPanel */
</script>
