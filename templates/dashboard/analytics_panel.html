<div class="section-title">Performance <span>Analytics</span></div>
<div class="analytics-kpis stagger" id="analyticsKpis">
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">trending_up</span>
    <div class="kpi-value text-teal" id="kpi-win-rate">--</div>
    <div class="kpi-label">Win Rate</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">block</span>
    <div class="kpi-value text-red" id="kpi-loss-rate">--</div>
    <div class="kpi-label">Loss Rate</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">bar_chart</span>
    <div class="kpi-value text-gold" id="kpi-profit-factor">--</div>
    <div class="kpi-label">Profit Factor</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">receipt_long</span>
    <div class="kpi-value" id="kpi-avg-trade">--</div>
    <div class="kpi-label">Avg Trade</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">today</span>
    <div class="kpi-value text-teal" id="kpi-daily-pnl">--</div>
    <div class="kpi-label">Daily PnL</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">date_range</span>
    <div class="kpi-value text-teal" id="kpi-weekly-pnl">--</div>
    <div class="kpi-label">Weekly PnL</div>
  </div>
  <div class="kpi-card">
    <span class="kpi-icon material-symbols-outlined">calendar_month</span>
    <div class="kpi-value text-teal" id="kpi-monthly-pnl">--</div>
    <div class="kpi-label">Monthly PnL</div>
  </div>
</div>
<div class="charts-row">
  <div class="mini-chart-card">
    <div class="mini-chart-title">
      <span class="material-symbols-outlined chart-title-icon">show_chart</span>
      Cumulative PnL — Last 30 Days
    </div>
    <div class="analytics-chart-container" id="pnlChartContainer"></div>
  </div>
  <div class="mini-chart-card">
    <div class="mini-chart-title">
      <span class="material-symbols-outlined chart-title-icon">donut_small</span>
      Win / Loss Distribution
    </div>
    <div class="analytics-chart-container" id="winChartContainer"></div>
  </div>
</div>
