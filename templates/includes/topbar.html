<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title" id="topbar-title">{{ page_title|default:"Dashboard" }}</div>
  <div class="topbar-pill"><div class="dot"></div> Live</div>
  <div class="topbar-balance" id="topbar-balance">${{ balance|floatformat:2 }}</div>
  <a href="{% url 'profile_page' %}" class="topbar-avatar-link" title="My Profile">
    {% if user.avatar %}
      <img src="{{ user.avatar.url }}" alt="Profile" class="topbar-avatar-img">
    {% else %}
      <div class="topbar-avatar-letter">{{ user.email|first|upper }}</div>
    {% endif %}
  </a>
  <div class="topbar-notif" id="notifBell" title="Notifications" onclick="toggleNotifications()">
    <span class="notif-icon">🔔</span>
    <div class="notif-badge" id="notifBadge"></div>
  </div>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-panel-header">
      <span>Notifications</span>
      <button class="notif-mark-read" onclick="markAllRead()">Mark all read</button>
    </div>
    <div class="notif-panel-body" id="notifList">
      <div class="notif-empty">No notifications yet.</div>
    </div>
  </div>
  <form method="post" action="{% url 'logout' %}" style="display:inline">
    {% csrf_token %}
    <button type="submit" class="btn-logout">Logout</button>
  </form>
</header>
