<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">A</div>
    <div class="sidebar-logo-text">ATS Application</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-label">Main</div>
      <button class="nav-item active" data-panel="dashboard" onclick="navigateToPanel('dashboard')"><span class="nav-icon material-symbols-outlined">dashboard</span> Dashboard</button>
      <button class="nav-item" data-panel="markets" onclick="navigateToPanel('markets')"><span class="nav-icon material-symbols-outlined">candlestick_chart</span> Markets</button>
      <button class="nav-item" data-panel="bot" onclick="navigateToPanel('bot')"><span class="nav-icon material-symbols-outlined">smart_toy</span> Trading Bot</button>
      <button class="nav-item" data-panel="analytics" onclick="navigateToPanel('analytics')"><span class="nav-icon material-symbols-outlined">analytics</span> Analytics</button>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Account</div>
      <button class="nav-item" data-panel="history" onclick="navigateToPanel('history')"><span class="nav-icon material-symbols-outlined">history</span> History</button>
      <button class="nav-item" data-panel="subscription" onclick="navigateToPanel('subscription')"><span class="nav-icon material-symbols-outlined">workspace_premium</span> Subscription</button>
      <button class="nav-item" data-panel="settings" onclick="navigateToPanel('settings')"><span class="nav-icon material-symbols-outlined">settings</span> Settings</button>
    </div>
  </div>
  <a href="{% url 'profile_page' %}" style="text-decoration:none;color:inherit">
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebar-avatar">
      {% if user.avatar %}
        <img src="{{ user.avatar.url }}" alt="Avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;cursor:pointer">
      {% else %}
        {{ user.email|first|upper }}
      {% endif %}
    </div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebar-name">{{ user.email|cut:"@"|first }}</div>
      <div class="sidebar-user-role" id="sidebar-broker">{{ user.broker|default:"No Broker" }}</div>
    </div>
  </div>
  </a>
</nav>
