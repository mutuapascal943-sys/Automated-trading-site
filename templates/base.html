{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex AI Pro{% if page_title %} — {{ page_title }}{% endif %}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% if messages %}
<div class="toast-container" id="toast-container">
  {% for message in messages %}
    <div class="toast {% if message.tags %}{{ message.tags }}{% else %}info{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
</div>
{% endif %}
<script src="{% static 'js/app.js' %}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
