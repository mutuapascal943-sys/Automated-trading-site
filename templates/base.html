{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex AI Pro{% if page_title %} — {{ page_title }}{% endif %}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% if messages %}
<div class="toast-container" id="toast-container">
  {% for message in messages %}
    <div class="toast {% if message.tags %}{{ message.tags }}{% else %}info{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
</div>
{% endif %}
<script src="{% static 'js/app.js' %}"></script>
<script>
(function(){
  var isAuthPage = document.querySelector('#page-login');
  if(isAuthPage && !document.querySelector('#page-app')){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '{% url "auto_login" %}', true);
    xhr.withCredentials = true;
    xhr.onload = function(){
      if(xhr.status >= 200 && xhr.status < 400){
        var url = xhr.responseURL || '';
        if(!url.includes('/login') && !url.includes('/auto-login')){
          window.location.href = url;
        }
      }
    };
    xhr.send();
  }
})();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
